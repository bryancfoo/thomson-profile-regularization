# example_fit_deck.toml — synthetic test case for fit.py
#
# Prerequisites:
#   python make_example_data.py   (generates example_data.h5)
#
# Then run the fit:
#   python thomson_fit.py
#   > Path to input deck (.toml): example_fit_deck.toml
#
# The result is written to example_result.h5 (see [output] below).
# Compare /params/Te0, /params/n, etc. against the true profiles stored
# in example_data.h5 as /Te_true_eV and /ne_true_cm3.
#
# ─── Schema notes ─────────────────────────────────────────────────────────────
# Arrays can be specified inline:     wavelengths = [261.0, 261.5, ...]
# Or as file references:              wavelengths = "file.h5:dataset"
#                                     wavelengths = "file.npy"
#                                     wavelengths = "file.csv"
# Paths are resolved relative to this deck file.
#
# Initial-value warm start from a prior fit (same time axis):
#   [params.Te0]
#   value = "prev_result.h5:Te0"   # (Nt,) array — one value per time step
#   min = 10.0
#   max = 5000.0
#   vary = true
#
# Cross-time-axis warm start (e.g. EPW result → IAW fit on a different time grid):
#   [data]
#   time_axis = "new_data.h5:time"          # (Nt,) fit time axis — required for interpolation
#
#   [params.Te0]
#   value            = "epw_result.h5:Te0"  # (Nt_src,) array on source time grid
#   source_time_axis = "epw_result.h5:time" # (Nt_src,) — triggers linear interpolation onto fit time axis
#   min = 10.0
#   max = 5000.0
#   vary = true
#
# Relative bounds — bounds that scale with each time step's value:
#   [params.Te0]
#   value   = "epw_result.h5:Te0"
#   rel_min = -0.10   # min = value * 0.90  (per time step)
#   rel_max = +0.10   # max = value * 1.10  (per time step)
#   vary = true
#
# Constrained ion fractions with a dummy free parameter — legacy lmfit-only
# form using per-time {t} substitution inside [params.X]:
#   [[extra_params]]
#   name = "ifract1_dummy"
#   value = 0.2
#   min = 0.0
#   max = 1.0
#   vary = true
#
#   [params.ifract1]
#   expr = "min(1 - ifract0_{t}, ifract1_dummy_{t})"
#   (requires backend = "lmfit")
#
# Backend-agnostic constraint section — works for both lmfit and grad. Keys
# are parameter prefixes; values are expressions written in terms of OTHER
# prefixes (no _{t} suffix — substitution is automatic). Available functions:
# min, max, abs, where, clip, sqrt, exp, log, plus arithmetic.
#
#   [[extra_params]]
#   name = "ifract1_dummy"
#   value = 0.2
#   min = 0.0
#   max = 1.0
#   vary = true
#
#   [[extra_params]]
#   name = "ui1_dummy"
#   value = 0.0
#   min = -5e5
#   max = 5e5
#   vary = true
#
#   [constraints]
#   Ti2     = "Ti1"                                    # equality coupling
#   ifract1 = "min(1 - ifract0, ifract1_dummy)"        # sum-to-1 with dummy clamp
#   ifract5 = "1 - ifract0 - ifract1 - ifract2 - ifract3 - ifract4"
#   ui1     = "max(ui1_dummy, ui0)"                    # ordering: ui1 >= ui0
# ──────────────────────────────────────────────────────────────────────────────

# ── Data ──────────────────────────────────────────────────────────────────────
[data]
path        = "example_data.h5"    # path relative to this deck file
pkl_dataset = "Pkl_data"           # (Nk, Nt) scattered power spectrum
var_dataset = "Pkl_var"            # (Nk, Nt) variance

# ── Measurement geometry & composition ───────────────────────────────────────
[measurement]
Nelectrons       = 1
ion_z            = [1, 6]          # deuterium (z=1), carbon (z=6)
ion_a            = [2, 12]         # atomic masses in amu
probe_wavelength = 263.25          # nm
probe_vec        = [0.0, 0.0, 1.0]
scatter_vec      = [1.0, 0.0, 0.0]
ue_dir           = [1.0, 0.0, 0.0]
ui_dir           = [1.0, 0.0, 0.0]
wavelengths      = "example_data.h5:wavelengths"   # (Nk,) array
normalization_type = "max"

# Optional extras (commented out for this simple case):
# instr_func_arr    = "irf.h5:instr_func"   # (Nk,) or (Nk, Nt) point-spread function
# irf_normalization = "area"                 # "area" | "peak" | "none"
# throughput        = "throughput.csv"       # (Nk,) wavelength-dependent sensitivity
# background_order  = 1                      # adds bg0, bg1 polynomial free params
# notch             = [263.0, 263.5]         # NaN out a wavelength range

# ── Probe-beam SRS/SBS gain correction (Turnbull et al., PRL 136, 135101 2026) ─
# Optional. If this section is omitted, no gain correction is applied (existing
# decks behave bit-for-bit identically). Adding the section enables the
# multiplicative S(k,w) -> S(k,w) * (e^(gamma L) - 1)/(gamma L) correction
# from Eqs. 6-7 of the paper, which captures Stokes amplification / anti-Stokes
# depletion as the scattered light traverses the probe beam.
#
# [probe_beam]
# intensity_W_per_cm2 = 9.2e14     # peak on-axis probe intensity
# diameter_um         = 165.0      # FWHM probe-beam diameter D_0
# pol_p_fraction      = 1.0        # 1.0 = pure p-pol (in scattering plane), 0.0 = s-pol
# gain_mode           = "exact"    # "exact" | "small_gain" | "off"

# ── Tikhonov regularization ───────────────────────────────────────────────────
# One [penalty.<prefix>] section per regularized parameter.
# prefix can be "Te", "Te0" (species 0), "n", etc.
# lambda_weights = [L0, L1, L2] penalize 0th, 1st, 2nd spatial/time derivatives.
# thresholds     = [t0, t1, t2] derivative must exceed threshold before penalty kicks in.
# relative       = true → scale penalty relative to the parameter value.
# monotonic      = 0 (symmetric), +1 (penalize decreases), -1 (penalize increases).

[penalty.n]
profile_axis   = "example_data.h5:time"
lambda_weights = [0.0, 1.0, 0.5]
thresholds     = [0.0, 0.0, 0.0]
relative       = true
norm_scale     = 1
monotonic      = 0

[penalty.Te0]
profile_axis   = "example_data.h5:time"
lambda_weights = [0.0, 2.0, 1.0]
thresholds     = [0.0, 0.0, 0.0]
relative       = true
norm_scale     = 1
monotonic      = 0

[penalty.Ti0]
profile_axis   = "example_data.h5:time"
lambda_weights = [0.0, 1.0, 0.5]
thresholds     = [0.0, 0.0, 0.0]
relative       = true
norm_scale     = 1
monotonic      = 0

# ── Parameter initial guesses, bounds, and vary flags ────────────────────────
# Units: n in cm^-3, temperatures in eV, velocities in m/s.
# Three-level key specificity (most to least specific): "Te0_3" > "Te0" > "Te"
# vary = false → parameter held fixed at its initial value.
#
# Warm start from a prior fit (array-valued initial value):
#   [params.Te0]
#   value = "prev_result.h5:Te0"   # (Nt,) array, one value per time step
#   min = 10.0
#   max = 5000.0
#   vary = true

[params.n]
value = 5e19        # starting guess: 5×10^19 cm^-3 (true profile spans 3–8×10^19)
min   = 1e18
max   = 1e21
vary  = true

[params.Te0]
value = 500.0       # eV — intentionally off-center from true 300–700 range
min   = 10.0
max   = 5000.0
vary  = true

[params.Ti0]
value = 150.0       # eV — true profile is 100–250
min   = 10.0
max   = 2000.0
vary  = true

[params.Ti1]        # carbon — hold at same guess as deuterium
value = 150.0
min   = 10.0
max   = 2000.0
vary  = true

# Fixed parameters (vary = false)
[params.efract0]
value = 1.0
vary  = false

[params.ifract0]
value = 0.8         # deuterium charge fraction (true value)
vary  = false

[params.ifract1]
value = 0.2         # carbon charge fraction (true value)
vary  = false

[params.ue0]
value = 0.0         # m/s
vary  = false

[params.ui0]
value = 0.0         # m/s — deuterium
vary  = false

[params.ui1]
value = 0.0         # m/s — carbon
vary  = false

[params.pe0]
value = 2.0         # Maxwellian super-Gaussian exponent
vary  = false

[params.pi0]
value = 2.0
vary  = false

[params.pi1]
value = 2.0
vary  = false

# ── Fit / optimizer ───────────────────────────────────────────────────────────
[fit]
backend  = "lmfit"      # "lmfit" → run_fit (Nelder-Mead etc.)
                        # "grad"  → run_fit_grad (JAX + optax, no extra_params/expr)
method   = "nelder"

# Gradient-based alternative (swap backend, comment out method/max_nfev):
# backend   = "grad"
# optimizer = "lbfgs"
# max_iter  = 500
# tol       = 1e-9

# ── Output ────────────────────────────────────────────────────────────────────
[output]
path = "example_fit_result.h5"
# Written datasets:
#   /best_fit          (Nk, Nt) forward-model spectrum at best-fit params
#   /params/<prefix>   (Nt,) recovered profile per parameter prefix
# File attributes:
#   loss, nfev, success, message, deck_toml (provenance copy of this file)
