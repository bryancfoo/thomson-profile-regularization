# examples/iaw_l_curve/fit.toml — Tikhonov L-curve sweep on the D+C IAW data.
#
# Same physics deck as ../iaw_constraints/ (multi-ion + [constraints] +
# [[extra_params]]), with two additions:
#
#   * [penalty.Te0] / [penalty.Ti0] — 1st- and 2nd-derivative Tikhonov terms
#     on the time profiles of Te and Ti. The relative weighting between L1
#     and L2, and between Te and Ti, is the *shape* of the regularizer.
#   * [l_curve]                     — sweeps a scalar lambda_scale over the
#     base lambda_weights and picks the corner of the residual-vs-penalty
#     curve as the optimal trade-off. Replaces the single MAP fit.
#
# Run:
#     python examples/data/make_data_iaw.py          # one-time
#     thomson-fit examples/iaw_l_curve/fit.toml      # ~2-5 min depending on hardware
#     python examples/iaw_l_curve/plot.py
#
# Outputs:
#     fit_result.h5    /best_fit + /params/* at the optimal lambda_scale, plus
#                      a full /l_curve group with all sweep fits.
#     l_curve.png      auto-generated by thomson_fit.py (see [l_curve].plot_path)
#     params_vs_time.png + spectra.png + l_curve_profiles.png  from plot.py

[data]
path        = "../../../examples/data/data_iaw.h5"
pkl_dataset = "Pkl_data"
var_dataset = "Pkl_var"

[measurement]
Nelectrons       = 1
ion_z            = [1, 6]                    # D (z=1), C (z=6)
ion_a            = [2, 12]
probe_wavelength = 2.6325e-7
probe_vec        = [0.0,        0.0, 1.0]
scatter_vec      = [0.8660254,  0.0, 0.5]
ue_dir           = [1.0, 0.0, 0.0]
ui_dir           = [1.0, 0.0, 0.0]
wavelengths        = "../../../examples/data/data_iaw.h5:wavelengths"
normalization_type = "max"
instr_func_arr     = "../../../examples/data/data_iaw.h5:irf"
irf_normalization  = "area"
throughput         = "../../../examples/data/data_iaw.h5:throughput"

# ── Free parameters: Te0, Ti0, ifract0 ─────────────────────────────────────
[params.n]
value = "../../../examples/data/data_iaw.h5:ne_true_cm3"
vary  = false

[params.Te0]
value = 400.0
min   = 50.0
max   = 2000.0
vary  = true

[params.Ti0]
value = 300.0
min   = 50.0
max   = 1500.0
vary  = true

[params.ifract0]
value = 0.5
min   = 0.01
max   = 0.99
vary  = true

[params.efract0]
value = 1.0
vary  = false

[params.ue0]
value = 0.0
vary  = false

[params.ui0]
value = 0.0
vary  = false

[params.ui1]
value = 0.0
vary  = false

[params.pe0]
value = 2.0
vary  = false

[params.pi0]
value = 2.0
vary  = false

[params.pi1]
value = 2.0
vary  = false

[[extra_params]]
name  = "ifract1_floor"
value = 0.10
min   = 0.0
max   = 0.5
vary  = true

[constraints]
Ti1     = "Ti0"
ifract1 = "max(ifract1_floor, 1 - ifract0)"

# ── Tikhonov penalties on the temperature profiles. ────────────────────────
# lambda_weights = [L0, L1, L2] — 0th, 1st, 2nd time-derivative weights.
# Here L0 = 0 (don't pull values toward zero) and L1 / L2 punish kinks and
# curvature. The relative weighting (0.5 vs 0.2, Te vs Ti) defines the
# regularizer "shape"; the L-curve sweep below holds it fixed and only
# scales the overall strength.
[penalty.Te0]
profile_axis   = "../../../examples/data/data_iaw.h5:time"
lambda_weights = [0.0, 0.5, 0.2]
thresholds     = [0.0, 0.0, 0.0]
relative       = true

[penalty.Ti0]
profile_axis   = "../../../examples/data/data_iaw.h5:time"
lambda_weights = [0.0, 0.5, 0.2]
thresholds     = [0.0, 0.0, 0.0]
relative       = true

# ── L-curve sweep: replaces the single MAP fit. ────────────────────────────
# For each s in lambda_scale, every prefix's lambda_weights is multiplied
# by s. With warm_start = true (default), an unregularized fit runs first
# and its parameter profiles seed the initial guess for every sweep point.
# The fit at the max-curvature point on the log-log L-curve becomes the
# saved /best_fit and is rendered through the streak/profile plots.
[l_curve]
enabled          = true
lambda_scale_log = { min = -2, max = 2, n = 11 }   # → np.logspace(-2, 2, 11)
warm_start       = true
plot_path        = "l_curve.png"

# ── Optimizer: plain LBFGS (no SGLD warmup — the unreg-fit warm-start in ──
# [l_curve] already provides a good initial guess for every sweep point).
[fit]
optimizer = "lbfgs"
max_iter  = 500
tol       = 1e-9

[output]
path = "fit_result.h5"

[plotting]
shot_num     = 1
streak_png   = "spectra_optimal.png"
profiles_png = "params_vs_time_optimal.png"
profile_vars = ["Te0", "Ti0", "ifract0", "ifract1"]
